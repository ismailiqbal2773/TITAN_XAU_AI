name: TITAN XAU AI — Integrity & Full Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  focused-integrity:
    name: Focused Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run focused integrity tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_0_canonical_integrity.py titan/tests/test_v2_8_7_p2_0_true_e2e_integration.py -v --tb=short

  full-suite-linux:
    name: Full Test Suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: focused-integrity
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pytest-asyncio pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run full suite
        run: |
          python -m pytest titan/tests/ -q --tb=line \
            --ignore=titan/tests/test_database.py \
            --ignore=titan/tests/test_infrastructure.py \
            --ignore=titan/tests/test_production_sprint4.py \
            --ignore=titan/tests/test_recovery.py

  windows-compat:
    name: Windows Compatibility Tests
    runs-on: windows-latest
    timeout-minutes: 20
    needs: focused-integrity
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pytest-asyncio pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run focused integrity tests on Windows
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_0_canonical_integrity.py titan/tests/test_v2_8_7_p2_0_true_e2e_integration.py -v --tb=short
