name: TITAN XAU AI — Integrity CI (v2.8.7-P2.5)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  focused-integrity:
    name: Focused Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run P2.5 forensic provenance tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_5_forensic_provenance.py -v --tb=short
      - name: Run P2.4 provenance & leakage tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_4_provenance_leakage.py -v --tb=short
      - name: Run P2.3 leakage & calibration tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_3_leakage_calibration.py -v --tb=short
      - name: Run monetary valuation tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_1_monetary_valuation.py -v --tb=short
      - name: Run canonical integrity tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_0_canonical_integrity.py -v --tb=short
      - name: Run regime policy matrix tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_1_regime_policy_matrix.py -v --tb=short

  runtime-parity:
    name: Runtime Parity & Adaptive Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run true adapter parity tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_2_true_adapter_parity.py -v --tb=short
      - name: Run adaptive/CEO consistency tests
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_2_adaptive_ceo_consistency.py -v --tb=short
      - name: Run mathematical invariants
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_1_mathematical_invariants.py -v --tb=short
      - name: Run true e2e integration
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_1_true_e2e_integration.py -v --tb=short
      - name: Run module 2 shadow runner tests
        run: |
          python -m pytest titan/tests/test_module_2_exness_forward_shadow_runner.py -v --tb=short

  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [focused-integrity, runtime-parity]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run full suite
        run: |
          python -m pytest titan/tests/ -q --tb=line \
            --ignore=titan/tests/test_database.py \
            --ignore=titan/tests/test_infrastructure.py \
            --ignore=titan/tests/test_production_sprint4.py \
            --ignore=titan/tests/test_recovery.py \
            --ignore=titan/tests/test_demo_micro_full_cycle.py \
            --ignore=titan/tests/test_run_managed_demo_micro_trade_adaptive_cli.py

  report-validation:
    name: Report Schema & Hash Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [focused-integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Validate report artifacts
        run: |
          python -c "
          import json, hashlib, os
          report_dir = 'data/reports/competition_candidate'
          required = [
              'trade_ledger.csv', 'baseline_metrics.json', 'walk_forward_metrics.json',
              'split_manifest.json', 'frozen_config.yaml', 'model_hash_manifest.json',
              'schema_scaler_hash_manifest.json', 'instrument_spec.json',
              'monthly_metrics.csv', 'long_short_metrics.json', 'regime_setup_metrics.json',
              'cost_breakdown.json', 'stress_metrics.json', 'monte_carlo_metrics.json',
              'parameter_neighbourhood.json', 'mathematical_invariant_audit.json',
              'final_verdict.json', 'report_hash_manifest.json', 'reproduction_command.txt',
          ]
          missing = [f for f in required if not os.path.exists(os.path.join(report_dir, f))]
          if missing:
              print(f'Missing artifacts: {missing}')
              exit(1)
          print(f'All {len(required)} artifacts present')
          "

  windows-compat:
    name: Windows Compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [focused-integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run focused tests on Windows
        run: |
          python -m pytest titan/tests/test_v2_8_7_p2_5_forensic_provenance.py titan/tests/test_v2_8_7_p2_4_provenance_leakage.py titan/tests/test_v2_8_7_p2_3_leakage_calibration.py titan/tests/test_v2_8_7_p2_1_monetary_valuation.py titan/tests/test_v2_8_7_p2_0_canonical_integrity.py -v --tb=short
