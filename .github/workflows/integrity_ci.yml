name: TITAN XAU AI Integrity CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_3_feature_failclosed.py titan/tests/test_v2_8_7_p2_5_3_continuous_equity.py titan/tests/test_v2_8_7_p2_5_2_closure.py titan/tests/test_v2_8_7_p2_0_canonical_integrity.py titan/tests/test_v2_8_7_p2_1_monetary_valuation.py -v --tb=short
