name: TITAN XAU AI Integrity CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-integrity:
    name: Focused Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run feature fail-closed tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_3_feature_failclosed.py -v --tb=short
      - name: Run continuous equity tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_3_continuous_equity.py -v --tb=short
      - name: Run closure tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_2_closure.py -v --tb=short
      - name: Run behavioral tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_1_behavioral.py -v --tb=short
      - name: Run provenance tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_5_forensic_provenance.py -v --tb=short
      - name: Run monetary valuation tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_1_monetary_valuation.py -v --tb=short
      - name: Run canonical integrity tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_0_canonical_integrity.py -v --tb=short

  runtime-parity:
    name: Runtime Parity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run adapter parity tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_2_true_adapter_parity.py -v --tb=short
      - name: Run adaptive CEO tests
        run: python -m pytest titan/tests/test_v2_8_7_p2_2_adaptive_ceo_consistency.py -v --tb=short
      - name: Run math invariants
        run: python -m pytest titan/tests/test_v2_8_7_p2_1_mathematical_invariants.py -v --tb=short
      - name: Run e2e integration
        run: python -m pytest titan/tests/test_v2_8_7_p2_1_true_e2e_integration.py -v --tb=short

  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [focused-integrity, runtime-parity]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pandas numpy pyarrow pyyaml scikit-learn xgboost
      - name: Run full suite
        run: |
          python -m pytest titan/tests/ -q --tb=line             --ignore=titan/tests/test_database.py             --ignore=titan/tests/test_infrastructure.py             --ignore=titan/tests/test_production_sprint4.py             --ignore=titan/tests/test_recovery.py
