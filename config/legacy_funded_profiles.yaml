# Account and leverage settings
account:
  balance: 100000
  leverage: 100
  symbol: "XAUUSD"
  contract_size_per_lot: 100  # 100 oz per lot for XAUUSD

# Prop limits
prop_limits:
  external_daily_dd: 0.03
  external_total_dd: 0.08
  internal_daily_dd: 0.025
  internal_total_dd: 0.065
  monthly_target: 0.10
  stretch_target: 0.12
  aggressive_target: 0.15

# Margin safety
margin_safety:
  preferred_max_usage: 0.10
  high_risk_threshold: 0.15
  reject_threshold: 0.20
  max_open_positions: 1

# Risk-based lot sizing
risk_based_lot_sizing:
  formula: "lot_size = risk_amount / (sl_distance * contract_size_per_lot)"
  risk_amount: "account_equity * risk_percent"
  leverage: 100
  contract_size_per_lot: 100
